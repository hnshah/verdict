# RAG eval — does your model answer faithfully from provided context?
#
# Generated by: verdict init --template rag
#
# What this measures
#   - Faithfulness:    no claims beyond what the context says
#   - Answer relevance: actually answers the user's question
#   - Groundedness:    cites or uses the supplied passages
#
# How to use
#   1. ollama pull qwen2.5:7b           (or pick another from `verdict tiers`)
#   2. verdict run --pack eval-packs/rag.yaml
#   3. Edit eval-packs/rag.yaml with YOUR documents + questions
#
# The judge below is local + free — no cloud cost. Swap to a cloud judge for
# higher-fidelity scoring if you have an API key.

models:
  # Strong general 7B — good baseline for "do I even need a bigger model?"
  - id: qwen2.5:7b
    model: qwen2.5:7b
    provider: ollama
    base_url: http://localhost:11434/v1
    api_key: none
    tags: [local, free]

  # Popular open-weight baseline
  - id: llama3.1:8b
    model: llama3.1:8b
    provider: ollama
    base_url: http://localhost:11434/v1
    api_key: none
    tags: [local, free]

  # Frontier — uncomment if you have ≥24GB RAM and pulled this model
  # - id: qwen2.5:14b
  #   model: qwen2.5:14b
  #   provider: ollama
  #   base_url: http://localhost:11434/v1
  #   api_key: none
  #   tags: [local, free]

  # Cloud baseline — uncomment + set OPENROUTER_API_KEY to compare against
  # - id: haiku
  #   model: anthropic/claude-haiku-3-5
  #   base_url: https://openrouter.ai/api/v1
  #   api_key: ${OPENROUTER_API_KEY}
  #   cost_per_1m_input: 0.8
  #   cost_per_1m_output: 4.0
  #   tags: [cloud]

# Local LLM-as-judge — keeps the eval free + private. Adjust the rubric to
# weight faithfulness more heavily if hallucinations are your main concern.
judge:
  model: qwen2.5:7b
  rubric:
    accuracy: 0.5       # bumped up — faithfulness is the headline metric for RAG
    completeness: 0.3
    conciseness: 0.2

packs:
  - eval-packs/rag.yaml

run:
  concurrency: 2
  retry_on_failure: true

output:
  dir: ./results
  formats: [markdown, json]
