# Customer support eval — does your model handle real support inquiries well?
#
# Generated by: verdict init --template support
#
# What this measures
#   - Tone:       empathetic, professional, on-brand
#   - Factual:    correct policies, no invented details
#   - Safety:     escalates or refuses when appropriate
#   - Completeness: addresses the user's underlying need, not just the words
#
# How to use
#   1. ollama pull qwen2.5:7b
#   2. verdict run --pack eval-packs/support.yaml
#   3. Edit eval-packs/support.yaml with YOUR product's real inquiries.
#      Replace the example "Acme Widgets" policies with yours.

models:
  - id: qwen2.5:7b
    model: qwen2.5:7b
    provider: ollama
    base_url: http://localhost:11434/v1
    api_key: none
    tags: [local, free]

  - id: llama3.1:8b
    model: llama3.1:8b
    provider: ollama
    base_url: http://localhost:11434/v1
    api_key: none
    tags: [local, free]

  # Add qwen2.5-coder:7b — sometimes code-tuned models handle structured replies
  # surprisingly well. Pull it (or remove this line).
  - id: qwen2.5-coder:7b
    model: qwen2.5-coder:7b
    provider: ollama
    base_url: http://localhost:11434/v1
    api_key: none
    tags: [local, free]

  # Cloud comparison — uncomment + set OPENROUTER_API_KEY
  # - id: haiku
  #   model: anthropic/claude-haiku-3-5
  #   base_url: https://openrouter.ai/api/v1
  #   api_key: ${OPENROUTER_API_KEY}
  #   cost_per_1m_input: 0.8
  #   cost_per_1m_output: 4.0
  #   tags: [cloud]

judge:
  model: qwen2.5:7b
  rubric:
    accuracy: 0.4         # policy correctness
    completeness: 0.4     # addresses the real need
    conciseness: 0.2

packs:
  - eval-packs/support.yaml

run:
  concurrency: 2

output:
  dir: ./results
  formats: [markdown, json]
