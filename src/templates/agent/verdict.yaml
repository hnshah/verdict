# Agent eval — does your model select the right tool for the task?
#
# Generated by: verdict init --template agent
#
# What this measures
#   - Tool-call accuracy:  picks the right tool, with the right arguments
#   - Planning quality:    sensible multi-step decomposition
#   - Cost per task:       how much does each successful task cost in $$ and tokens
#
# How to use
#   1. ollama pull qwen2.5:7b
#   2. verdict run --pack eval-packs/agent.yaml
#   3. Edit eval-packs/agent.yaml — replace the example tools with your real
#      tool catalog (function/JSON schema). The `assertions` array uses the
#      built-in `tool_call` scorer for deterministic grading.

models:
  # Code/instruction-following model — best at tool selection at small sizes
  - id: qwen2.5-coder:7b
    model: qwen2.5-coder:7b
    provider: ollama
    base_url: http://localhost:11434/v1
    api_key: none
    tags: [local, free, code]

  # General baseline
  - id: qwen2.5:7b
    model: qwen2.5:7b
    provider: ollama
    base_url: http://localhost:11434/v1
    api_key: none
    tags: [local, free]

  - id: llama3.1:8b
    model: llama3.1:8b
    provider: ollama
    base_url: http://localhost:11434/v1
    api_key: none
    tags: [local, free]

  # Cloud comparison — uncomment + set OPENROUTER_API_KEY
  # - id: haiku
  #   model: anthropic/claude-haiku-3-5
  #   base_url: https://openrouter.ai/api/v1
  #   api_key: ${OPENROUTER_API_KEY}
  #   cost_per_1m_input: 0.8
  #   cost_per_1m_output: 4.0
  #   tags: [cloud]

judge:
  model: qwen2.5:7b
  rubric:
    accuracy: 0.6        # bumped up — tool call correctness is the headline
    completeness: 0.25
    conciseness: 0.15

packs:
  - eval-packs/agent.yaml

run:
  concurrency: 2

output:
  dir: ./results
  formats: [markdown, json]
